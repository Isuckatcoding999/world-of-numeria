<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The World of Numeria</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hud">
  <h1>THE WORLD OF NUMERIA</h1>
  <p>Clear the Floors. Master Mathematics.</p>
</header>

<section class="map-section">
  <img src="assets/numeria-map.png" class="map">
</section>

<section class="zones">

  <div class="zone" onclick="openPanel('beginner')">
    🏘️ Beginner Math
  </div>

  <div class="zone" onclick="openPanel('algebra')">
    🏙️ Algebra City
  </div>

  <div class="zone" onclick="openPanel('algebra2')">
    🧠 Algebra II Highlands
  </div>

  <div class="zone" onclick="openPanel('geometry')">
    📐 Geometry Realms
  </div>

  <div class="zone" onclick="openPanel('trig')">
    🌌 Trigonometry Skies
  </div>

</section>

<!-- INFO PANEL -->
<div id="panel" class="panel hidden">
  <div class="panel-content">
    <span class="close" onclick="closePanel()">✖</span>
    <div id="panel-text"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
